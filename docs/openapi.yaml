          example: "0 */5 * * * *"
        scheduling:
          $ref: "#/components/schemas/SchedulingConfiguration"
          description: Scheduling configuration for the task
        is_active:
          type: boolean
          description: Whether the scheduled task is active
          default: true
          example: true

    ScheduledTaskUpdateRequest:
      type: object
      properties:
        commands:
          type: array
          items:
            $ref: "#/components/schemas/CommandSendPayloadRequest"
          description: Commands to execute as part of the scheduled task
        schedule:
          type: string
          description: Cron expression for scheduling (deprecated - use scheduling instead)
          example: "0 */5 * * * *"
        scheduling:
          $ref: "#/components/schemas/SchedulingConfiguration"
          description: Scheduling configuration for the task
        is_active:
          type: boolean
          description: Whether the scheduled task is active
          example: true

    ScheduledTaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Scheduled task ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        device_id:
          type: string
          format: uuid
          description: Target device ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/CommandSendPayloadRequest"
          description: Commands in the scheduled task
        schedule:
          type: string
          description: Cron expression for scheduling (deprecated - use scheduling instead)
          example: "0 */5 * * * *"
        scheduling:
          $ref: "#/components/schemas/SchedulingConfigurationResponse"
          description: Scheduling configuration for the task
        is_active:
          type: boolean
          description: Whether the scheduled task is active
          example: true

    PaginatedScheduledTaskResponse:
      type: object
      properties:
