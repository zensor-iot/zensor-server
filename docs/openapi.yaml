        app_eui:
          type: string
          description: LoRaWAN Application EUI
          example: "0000000000000001"
        dev_eui:
          type: string
          description: LoRaWAN Device EUI
          example: "0000000000000001"
        app_key:
          type: string
          description: LoRaWAN Application Key
          example: "00000000000000000000000000000000"

    DeviceUpdateRequest:
      type: object
