        id:
          type: string
          format: uuid
          description: Maintenance execution ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        version:
          type: integer
          description: Version for optimistic locking
          example: 1
        activity_id:
          type: string
          format: uuid
          description: Maintenance activity ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        scheduled_date:
          type: string
          format: date-time
          description: Scheduled date and time for the execution
          example: "2024-01-15T10:00:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Date and time when the execution was completed
          example: "2024-01-15T10:30:00Z"
        completed_by:
          type: string
          nullable: true
          description: User ID or identifier who completed the execution
          example: "user-123"
        is_overdue:
          type: boolean
          description: Whether the execution is overdue
          example: false
        overdue_days:
          type: integer
          description: Number of days the execution is overdue
          example: 0
        field_values:
          type: object
          additionalProperties: true
          description: Field values for the maintenance execution
          example:
            temperature: 25.5
            notes: "All systems operational"
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2024-01-01T00:00:00Z"

    PaginatedExecutionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionResponse"
          description: Array of maintenance execution objects
        pagination:
          $ref: "#/components/schemas/PaginationInfo"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    apiKeyBearer:
      type: http
      scheme: bearer
      description: >-
        API key issued via POST /v1/admin/api-keys, presented as
        `Authorization: Bearer zsk_...`. Grants access to the full API except
        `/v1/admin/*` routes.

