          example: 10

    # Scheduled Task schemas
    ScheduledTaskCreateRequest:
      type: object
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            $ref: "#/components/schemas/CommandSendPayloadRequest"
          description: Commands to execute as part of the scheduled task
        schedule:
          type: string
