          type: array
          items:
            $ref: "#/components/schemas/ScheduledTaskResponse"
          description: Array of scheduled task objects
        pagination:
          $ref: "#/components/schemas/PaginationInfo"

    # Scheduling Configuration schemas
    SchedulingConfiguration:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: ["cron", "interval"]
          description: Type of scheduling (cron or interval)
          example: "interval"
        schedule:
          type: string
          description: Cron expression (required for cron type)
          example: "0 0 * * *"
        initial_day:
          type: string
          format: date-time
          description: Initial day for interval scheduling (required for interval type)
          example: "2024-01-15T00:00:00Z"
        day_interval:
          type: integer
          minimum: 1
          description: Days between executions for interval scheduling (required for interval type)
          example: 2
        execution_time:
          type: string
          pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: Time of day for execution in HH:MM format (required for interval type)
          example: "02:00"

    SchedulingConfigurationResponse:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: ["cron", "interval"]
          description: Type of scheduling (cron or interval)
          example: "interval"
        schedule:
          type: string
          description: Cron expression (for cron type)
          example: "0 0 * * *"
        initial_day:
          type: string
          format: date-time
          description: Initial day for interval scheduling
          example: "2024-01-15T00:00:00Z"
        day_interval:
          type: integer
          minimum: 1
          description: Days between executions for interval scheduling
          example: 2
        execution_time:
          type: string
          pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: Time of day for execution in HH:MM format
          example: "02:00"
        next_execution:
          type: string
          format: date-time
          description: Calculated next execution time
          example: "2024-01-17T02:00:00Z"

