---
openapi: 3.0.3
info:
  title: Zensor Server API
  description: Zensor Server API for IoT device management and task scheduling
  version: 1.0.0
  contact:
    name: Zensor Team
    email: support@zensor-iot.net
  license:
    name: Proprietary
    url: https://zensor-iot.net

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.zensor-iot.net
    description: Production server

paths:
  # Health and Monitoring
  /healthz:
    get:
      summary: Health check
      description: Returns the health status of the server
      tags:
        - Health
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"

  /metrics:
    get:
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics
      tags:
        - Monitoring
      responses:
        "200":
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string

  # Authentication
  /auth/login:
    get:
      summary: Start OAuth login
      description: Sets a short-lived CSRF state cookie and redirects the browser to the OAuth provider's consent page
      tags:
        - Authentication
      responses:
        "302":
          description: Redirect to the OAuth provider authorization URL
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: CSRF state cookie (zensor_oauth_state)
              schema:
                type: string
        "500":
          description: Failed to start login

  /auth/callback:
    get:
      summary: OAuth callback
      description: Handles the OAuth provider redirect, validates the CSRF state, exchanges the authorization code, creates a session, and redirects to the web UI. Users not on the allowlist are redirected to the access-denied page.
      tags:
        - Authentication
      parameters:
        - name: state
          in: query
          required: true
          description: CSRF state value (must match the state cookie)
          schema:
            type: string
        - name: code
          in: query
          required: true
          description: OAuth authorization code
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the web UI on success, or to the access-denied page if the email is not allowed or not verified
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Session cookie on successful login
              schema:
                type: string
        "400":
          description: Invalid OAuth state or missing authorization code
        "500":
          description: Login failed

  /auth/logout:
    post:
      summary: Logout
      description: Invalidates the current session and clears the session cookie
      tags:
        - Authentication
      responses:
        "204":
          description: Logged out successfully

  /v1/me:
    get:
      summary: Get current user
      description: Returns the authenticated user derived from the session cookie
      tags:
        - Authentication
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/allowed-users:
    get:
      summary: List allowed users
      description: Retrieve all allowlist entries
      tags:
        - Authentication
      responses:
        "200":
          description: List of allowed users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllowedUserResponse"
        "500":
          description: Failed to list allowed users

    post:
      summary: Add allowed user
      description: Add an email address to the login allowlist
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowedUserCreateRequest"
      responses:
        "201":
          description: Allowed user created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedUserResponse"
        "400":
          description: Invalid allowed user
        "409":
          description: Email already allowed

  /v1/admin/allowed-users/{id}:
    put:
      summary: Update allowed user
      description: Update an allowlist entry (admin flag)
      tags:
        - Authentication
      parameters:
        - name: id
          in: path
          required: true
          description: Allowed user ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowedUserUpdateRequest"
      responses:
        "200":
          description: Allowed user updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedUserResponse"
        "400":
          description: Invalid request body
        "404":
          description: Allowed user not found
        "500":
          description: Failed to update allowed user

    delete:
      summary: Remove allowed user
      description: Remove an entry from the login allowlist
      tags:
        - Authentication
      parameters:
        - name: id
          in: path
          required: true
          description: Allowed user ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Allowed user removed successfully
        "400":
          description: ID is required
        "500":
          description: Failed to remove allowed user

  /v1/admin/api-keys:
    get:
      summary: List API keys
      description: Retrieve all API keys; key material is never returned
      tags:
        - Authentication
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKeyResponse"
        "500":
          description: Failed to list API keys

    post:
      summary: Create API key
      description: >-
        Create a machine credential for non-human clients. The plaintext key is
        returned only in this response and cannot be retrieved again. Clients
        present it as `Authorization: Bearer <key>`; API keys are denied access
        to `/v1/admin/*` routes.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreateRequest"
      responses:
        "201":
          description: API key created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreatedResponse"
        "400":
          description: Name is required
        "409":
          description: API key name already exists

  /v1/admin/api-keys/{id}:
    delete:
      summary: Revoke API key
      description: Permanently revoke an API key; revocation takes effect immediately
      tags:
        - Authentication
      parameters:
        - name: id
          in: path
          required: true
          description: API key ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: API key revoked successfully
        "404":
          description: API key not found
        "500":
          description: Failed to revoke API key

  # WebSocket
  /ws/device-messages:
    get:
      summary: Device messages WebSocket
      description: WebSocket endpoint for real-time device messages from all devices
      tags:
        - WebSocket
      responses:
        "101":
          description: WebSocket connection established
          headers:
            Upgrade:
              schema:
                type: string
                example: "websocket"
            Connection:
              schema:
                type: string
                example: "Upgrade"

  /ws/devices/{device_id}/messages:
    get:
      summary: Device-specific messages WebSocket
      description: WebSocket endpoint for real-time messages from a specific device
      tags:
        - WebSocket
      parameters:
        - name: device_id
          in: path
          required: true
          description: The ID of the device to subscribe to
          schema:
            type: string
            format: uuid
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "101":
          description: WebSocket connection established
          headers:
            Upgrade:
              schema:
                type: string
                example: "websocket"
            Connection:
              schema:
                type: string
                example: "Upgrade"
        "400":
          description: Bad request - device_id is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "device_id is required"

  /ws/victron/status:
    get:
      summary: Victron system status WebSocket
      description: WebSocket endpoint for real-time Victron system status updates. Sends the latest snapshot on connect, then broadcasts status messages.
      tags:
        - WebSocket
      responses:
        "101":
          description: WebSocket connection established
          headers:
            Upgrade:
              schema:
                type: string
                example: "websocket"
            Connection:
              schema:
                type: string
                example: "Upgrade"

  # Tenants
  /v1/tenants:
    get:
      summary: List tenants
      description: Retrieve a list of all tenants
      tags:
        - Tenants
      parameters:
        - name: include_deleted
          in: query
          description: Include soft-deleted tenants in the response
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTenantResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create tenant
      description: Create a new tenant
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreateRequest"
      responses:
        "201":
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Tenant already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/tenants/{id}:
    get:
      summary: Get tenant
      description: Retrieve a specific tenant by ID
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update tenant
      description: Update an existing tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdateRequest"
      responses:
        "200":
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Tenant already exists or is soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Soft delete tenant
      description: Soft delete a tenant (marks as deleted but doesn't remove from database)
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tenant soft deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Tenant is already soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/tenants/{id}/activate:
    post:
      summary: Activate tenant
      description: Activate a deactivated tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tenant activated successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Tenant is soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/tenants/{id}/deactivate:
    post:
      summary: Deactivate tenant
      description: Deactivate an active tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tenant deactivated successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Tenant is soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/tenants/{id}/adopt:
    post:
      summary: Adopt device to tenant
      description: Associate a device with a tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAdoptDeviceRequest"
      responses:
        "200":
          description: Device adopted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Tenant or device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tenant is soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/tenants/{id}/configuration:
    put:
      summary: Create or update tenant configuration
      description: Upsert tenant configuration including timezone and notification email settings. Requires user authentication via X-User-ID header.
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
        - name: X-User-ID
          in: header
          required: true
          description: User ID for authentication and permission checking
          schema:
            type: string
            format: uuid
            example: "123e4567-e89b-12d3-a456-426614174000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantConfigurationRequest"
      responses:
        "200":
          description: Tenant configuration created or updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfigurationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized - missing or invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - user does not have permission to access this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      summary: Get tenant configuration
      description: Retrieve tenant configuration including timezone and notification settings
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfigurationResponse"
        "404":
          description: Tenant configuration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/tenants/{id}/devices:
    get:
      summary: List tenant devices
      description: Retrieve all devices associated with a tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: List of tenant devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDeviceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Tenant is soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # Devices
  /v1/devices:
    get:
      summary: List devices
      description: Retrieve a list of all devices
      tags:
        - Devices
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDeviceResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create device
      description: Create a new device
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreateRequest"
      responses:
        "201":
          description: Device created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Device already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/devices/{id}:
    get:
      summary: Get device
      description: Retrieve a specific device by ID
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update device
      description: Update an existing device's display name
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdateRequest"
      responses:
        "200":
          description: Device updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/devices/{id}/commands:
    post:
      summary: Send command to device
      description: Send a command sequence to a specific device
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandSendRequest"
      responses:
        "201":
          description: Command sent successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/devices/{id}/tasks:
    get:
      summary: List device tasks
      description: Retrieve all tasks for a specific device
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTaskResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create task for device
      description: Create a task with multiple commands for a specific device
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Command overlap detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/devices/{id}/evaluation-rules:
    get:
      summary: List device evaluation rules
      description: Retrieve all evaluation rules for a specific device
      tags:
        - Evaluation Rules
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: List of evaluation rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEvaluationRuleResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create evaluation rule for device
      description: Create a new evaluation rule for a specific device
      tags:
        - Evaluation Rules
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRuleCreateRequest"
      responses:
        "201":
          description: Evaluation rule created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # Users
  /v1/users/{id}:
    get:
      summary: Get user
      description: Retrieve a specific user by ID
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
