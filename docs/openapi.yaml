components:
  schemas:
    # Common schemas
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
      example:
        message: "An error occurred"

    # Tenant schemas
    TenantCreateRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Tenant name
          example: "Acme Corporation"
        email:
          type: string
          format: email
          description: Tenant email address
          example: "admin@acme.com"
        description:
          type: string
          maxLength: 500
          description: Tenant description
          example: "Manufacturing company specializing in IoT solutions"

    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Tenant name
          example: "Acme Corporation"
        email:
          type: string
          format: email
          description: Tenant email address
          example: "admin@acme.com"
        description:
          type: string
          maxLength: 500
          description: Tenant description
          example: "Manufacturing company specializing in IoT solutions"
        version:
          type: integer
          description: Tenant version for optimistic locking
          example: 1

    TenantAdoptDeviceRequest:
      type: object
      required:
        - device_id
      properties:
        device_id:
          type: string
          format: uuid
          description: Device ID to adopt
          example: "123e4567-e89b-12d3-a456-426614174000"

    TenantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Tenant ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          description: Tenant name
          example: "Acme Corporation"
        email:
          type: string
          format: email
          description: Tenant email address
          example: "admin@acme.com"
        description:
          type: string
          description: Tenant description
          example: "Manufacturing company specializing in IoT solutions"
        is_active:
          type: boolean
          description: Whether the tenant is active
          example: true
        version:
          type: integer
          description: Tenant version for optimistic locking
          example: 1
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2024-01-01T00:00:00Z"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Soft deletion timestamp
          example: null

    TenantConfigurationRequest:
      type: object
      required:
        - timezone
      properties:
        timezone:
          type: string
          description: IANA timezone identifier (e.g., "America/New_York", "Europe/London")
          example: "America/New_York"
        notification_email:
          type: string
          format: email
          description: Email address for notifications
          example: "notifications@acme.com"

    TenantConfigurationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Configuration ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        tenant_id:
          type: string
          format: uuid
          description: Tenant ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        timezone:
          type: string
          description: IANA timezone identifier
          example: "America/New_York"
        notification_email:
          type: string
          format: email
          description: Email address for notifications
          example: "notifications@acme.com"
        version:
          type: integer
          description: Configuration version for optimistic locking
          example: 1
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2024-01-01T00:00:00Z"

    TenantListResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
