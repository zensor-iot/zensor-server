          type: string
          format: date-time
          nullable: true
          description: Timestamp of last received message
          example: "2024-01-01T00:00:00Z"

    DeviceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceResponse"

    # Command schemas
    CommandSendRequest:
      type: object
      required:
        - sequence
      properties:
        priority:
          type: string
          description: Command priority
          enum: [LOW, NORMAL, HIGH]
          default: "NORMAL"
          example: "NORMAL"
        sequence:
          type: array
          items:
            $ref: "#/components/schemas/CommandSendPayloadRequest"
          description: Sequence of commands to send

    CommandSendPayloadRequest:
      type: object
      required:
        - index
        - value
      properties:
        wait_for:
          type: string
          description: Duration to wait before executing this command
          example: "30s"
        priority:
          type: string
          description: Command priority
          enum: [LOW, NORMAL, HIGH]
          example: "NORMAL"
        index:
          type: integer
          minimum: 0
          maximum: 255
          description: Sensor/actuator index
          example: 1
        value:
          type: integer
          minimum: 0
          maximum: 255
          description: Command value
          example: 100

    CommandResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Command ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        priority:
          type: string
          description: Command priority
          example: "NORMAL"

    # Task schemas
    TaskCreateRequest:
      type: object
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            $ref: "#/components/schemas/CommandSendPayloadRequest"
          description: Commands to execute as part of the task

    TaskCommandResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Command ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        index:
          type: integer
          minimum: 0
          maximum: 255
          description: Sensor/actuator index
          example: 1
        value:
          type: integer
          minimum: 0
          maximum: 255
          description: Command value
          example: 100
        port:
          type: integer
          minimum: 0
          maximum: 255
          description: Command port
          example: 1
        priority:
          type: string
          description: Command priority
          example: "NORMAL"
        dispatch_after:
          type: string
          format: date-time
          description: When the command should be dispatched
          example: "2024-01-01T00:00:00Z"
        ready:
          type: boolean
          description: Whether the command is ready to be sent
          example: true
        sent:
          type: boolean
          description: Whether the command has been sent
          example: false
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: When the command was sent
          example: "2024-01-01T00:00:00Z"

    TaskResponse:
      type: object
