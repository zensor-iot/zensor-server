general:
  log_level: info
auth:
  enabled: true
  google:
    client_id: 829153781429-o9vbh05h9jdie1p6fal5ehvn87e1olen.apps.googleusercontent.com
    client_secret: "" # set via ZENSOR_SERVER_AUTH_GOOGLE_CLIENT_SECRET
    redirect_url: "https://portal.zensor-iot.net/auth/callback"
  session_ttl: "168h"
  bootstrap_admin_email: "seadiaz@gmail.com"
mqtt:
  broker: "localhost:1883"
database:
  dsn: "host=localhost user=postgres dbname=postgres port=5432 sslmode=disable"
  query_timeout: "5s"
redis:
  addr: "localhost:6379"
  password: ""
  db: 0
mqtt_client:
  broker: nam1.cloud.thethings.network:1883
  client_id: zensor_server_local
mailersend:
  api_key: dummy-api-key
  from_email: "noreply@zensor-iot.net"
  from_name: "Zensor Server"
fcm:
  project_id: "my-first-action-8b831"
  service_account_path: "./service_account.json"
notification:
  webpush:
    vapid_public_key: "" # set via ZENSOR_SERVER_NOTIFICATION_WEBPUSH_VAPID_PUBLIC_KEY
    vapid_private_key: "" # set via ZENSOR_SERVER_NOTIFICATION_WEBPUSH_VAPID_PRIVATE_KEY
    subscriber: "mailto:admin@zensor-iot.net"
metrics:
  - name: "commands_total"
    type: "counter"
    topic: "device_messages"
    event_type: "command_status_update"
    custom_attributes:
      device_name: "DeviceName"
      status: "Status"
  - name: "scheduled_tasks_total"
    type: "counter"
    topic: "scheduled_tasks"
    event_type: "task_executed"
    custom_attributes: {}
  - name: "sensor_temperature"
    type: "gauge"
    topic: "device_messages"
    event_type: "temperature_data_received"
    value_property_name: "Value"
    custom_attributes:
      device_name: "DeviceName"
      app_id: "AppID"
      index: "Index"
  - name: "sensor_humidity"
    type: "gauge"
    topic: "device_messages"
    event_type: "humidity_data_received"
    value_property_name: "Value"
    custom_attributes:
      device_name: "device_id"
      app_id: "AppID"
      index: "Index"
  - name: "sensor_water_flow"
    type: "gauge"
    topic: "device_messages"
    event_type: "water_flow_data_received"
    value_property_name: "Value"
    custom_attributes:
      device_name: "device_id"
      app_id: "AppID"
      index: "Index"
  - name: "controller_relay"
    type: "gauge"
    topic: "device_messages"
    event_type: "relay_data_received"
    value_property_name: "Value"
    custom_attributes:
      device_name: "device_id"
      app_id: "AppID"
      index: "Index"
victron:
  portal_id: "d41243b4e8e4"
  mqtt:
    broker: "tcp://192.168.5.181:1883"
    client_id: zensor_victron
    username: ""
    password: ""
  cache_ttl: "5m"
modules:
  permaculture:
    enabled: true
  maintenance:
    enabled: true
  victron:
    enabled: true
execution_worker:
  ticker_interval: "5m"

push_notifications:
  - name: "execution_reminder"
    topic: "maintenance_executions"
    event_type: "execution_ready_for_notification"
    tenant_id_path: "tenant_id"
    user_id_path: ""
    title: "Execution Reminder"
    body: "Scheduled execution is due soon"
    deeplink: "/maintenance/executions"
    deeplink_template: "/maintenance/executions/%s"
  - name: "execution_overdue"
    topic: "maintenance_executions"
    event_type: "execution_overdue"
    tenant_id_path: "tenant_id"
    user_id_path: ""
    title: "Execution Overdue"
    body: "Scheduled execution is overdue"
    deeplink: "/maintenance/executions"
    deeplink_template: "/maintenance/executions/%s"
